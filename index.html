<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>墨水屏库存便利贴 · 分栏排版</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#272c36;--fg:#e6e8ee;--dim:#8b93a3;--acc:#5b9dff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif}
  header{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
  header h1{font-size:15px;margin:0;font-weight:600}
  header .sub{font-size:11px;color:var(--dim)}
  main{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 46px)}
  .side{overflow:auto;padding:12px;border-right:1px solid var(--line);min-height:0}
  .stage{padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;background:#0b0d11;min-height:0;overflow:hidden}
  .previewbox{border:1px solid var(--line);border-radius:10px;padding:10px 10px 12px;
    margin:0;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .previewbox legend{font-size:11px;color:var(--dim);padding:0 5px;letter-spacing:.06em}
  #preview{cursor:zoom-in}

  /* 点图全屏 */
  #zoomlay{position:fixed;inset:0;z-index:99;background:rgba(6,8,12,.96);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
  #zoomlay.on{display:flex}
  #zoomlay canvas{image-rendering:pixelated;background:#fff;border-radius:4px;max-width:100%;max-height:82vh}
  #zoomlay .zclose{color:#8b93a3;font-size:13px;background:#181c24;border:1px solid #272c36;
    border-radius:999px;padding:8px 16px}

  /* 手机：单列排布，预览在所有内容之后，宽度与其它输入框同宽 */
  @media(max-width:880px){
    html,body{overflow-x:hidden}
    main{display:flex;flex-direction:column;height:auto;width:100%}
    .side{overflow:visible;border-right:0;width:100%}
    .stage{width:100%;max-width:100vw;border-top:1px solid var(--line);padding:12px}
  }
  fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;padding:10px 10px 12px}
  legend{font-size:11px;color:var(--dim);padding:0 5px;letter-spacing:.06em}
  label{display:block;font-size:12px;color:var(--dim);margin:9px 0 4px}
  input[type=text],input[type=number],select,textarea{width:100%;background:#0c0e13;border:1px solid var(--line);
    color:var(--fg);border-radius:7px;padding:7px 9px;font:inherit;font-size:13px;outline:none}
  textarea{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.6;resize:vertical;min-height:230px}
  textarea:focus,input:focus,select:focus{border-color:var(--acc)}
  .row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
  input[type=range]{width:100%;accent-color:var(--acc)}
  .chk{display:flex;align-items:center;gap:7px;margin:8px 0;font-size:13px;cursor:pointer}
  .chk input{accent-color:var(--acc);width:15px;height:15px;flex:none}
  .hint{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.55}
  .hint code{background:#0c0e13;padding:1px 4px;border-radius:3px;font-size:11px}
  .btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  button{background:#222735;border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:8px 12px;
    font:inherit;font-size:13px;cursor:pointer}
  button:hover{background:#2b3140}
  button.pri{background:var(--acc);border-color:var(--acc);color:#07101f;font-weight:600}
  #preview{background:#fff;border-radius:3px;box-shadow:0 6px 20px rgba(0,0,0,.5);
    image-rendering:pixelated;display:block}
  .meta{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:#9aa2b0;opacity:.65;
    text-align:center;line-height:1.5;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:100%}
  .meta.warn{color:#9aa2b0;opacity:.65}
  details{margin-top:8px}summary{font-size:12px;color:var(--dim);cursor:pointer}
  textarea.hex{font-size:11px;min-height:120px}

  /* ---- 快速编辑 ---- */
  .addrow{display:flex;gap:7px;margin-top:4px}
  .addrow input{flex:1;min-width:0}
  .addrow button{flex:none;padding:8px 16px}
  .verdict{margin-top:9px;padding:9px 10px;border-radius:8px;background:#0c0e13;
    border:1px solid var(--line);font-size:12.5px;line-height:1.6}
  .verdict b{color:var(--acc)}
  .verdict .undo{color:var(--warn);cursor:pointer;text-decoration:underline}
  #matches{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  #matches:empty{margin-top:0}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;
    background:#1b1f28;border:1px solid var(--line);font-size:12.5px;cursor:pointer;
    min-height:36px;user-select:none}
  .chip:hover{background:#242a35}
  .chip .who{color:var(--dim);font-size:11px}
  .chip .n{font-variant-numeric:tabular-nums;color:var(--acc)}
  .cat{border:1px solid var(--line);border-radius:9px;margin-bottom:9px;overflow:hidden}
  .cat>h4{margin:0;padding:8px 10px;font-size:13px;font-weight:600;background:#131720;
    display:flex;justify-content:space-between;align-items:center}
  .cat>h4 span{font-size:11px;color:var(--dim);font-weight:400}
  .row-item{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 10px;
    border-top:1px solid #1c2029;min-height:42px}
  .row-item .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stepper{display:flex;align-items:center;gap:0;flex:none}
  .stepper button{width:34px;height:34px;padding:0;border-radius:7px;font-size:16px;line-height:1}
  .stepper .n{min-width:30px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
  .del{flex:none;width:34px;height:34px;padding:0;border-radius:7px;color:#ff7b7b;font-size:15px}
  .empty{font-size:12px;color:var(--dim);padding:9px 10px}

  .presets button{padding:4px 8px;font-size:11px}
  .presets button.on{background:var(--acc);border-color:var(--acc);color:#07101f}
</style>
</head>
<body>
<header>
  <h1>墨水屏库存便利贴</h1>
  <span class="sub" id="build">…</span>
</header>

<main>
<div class="side">

  <fieldset>
    <legend>墨水屏</legend>
    <div class="addrow">
      <button class="pri" id="blebtn">连接设备</button>
      <button id="rebtn">重连</button>
    </div>
    <div class="hint" id="blestat">先连接，再推送。</div>
  </fieldset>


  <fieldset>
    <legend>标题背景色</legend>
    <label>标题文字</label>
    <input type="text" id="title" placeholder="备货库存">
    <label>样式</label>
    <select id="hdrstyle">
      <option value="gray">中灰网点底 + 反白字</option>
      <option value="solid">纯黑底 + 反白字</option>
      <option value="none">无底 + 黑字</option>
    </select>
  </fieldset>

  <fieldset>
    <legend>快速增 / 减</legend>
    <div class="addrow">
      <input type="text" id="quick" placeholder="增加：输入物品名" autocomplete="off" enterkeyhint="done">
      <button class="pri" id="addbtn">添加</button>
    </div>
    <div id="verdict" class="verdict" hidden></div>

    <div class="addrow" style="margin-top:8px">
      <input type="text" id="quickdel" placeholder="减少：输入已有物品名" autocomplete="off" enterkeyhint="done">
      <button id="delbtn">减少</button>
    </div>
    <div id="matches"></div>
    <div class="hint">
      <b>增加</b>：只输名称，工具按关键词自动判断归到哪个栏目，数量默认 ×1。<br>
      <b>减少</b>：输入后下方列出清单里匹配的物品，点一下就减 1；减到 0 自动移出清单。<br>
      想指定栏目：<code>面部护理 眼霜</code>；想直接给数量：<code>洗发水 2</code>。
    </div>
  </fieldset>

  <fieldset>
    <legend>清单</legend>
    <div id="cats"></div>
    <details>
      <summary>文本模式（高级）</summary>
      <textarea id="src" spellcheck="false"></textarea>
      <div class="hint"><code>@分类名</code> 开始新分类；<code>名称 ×3</code> 表示还剩 3 个。</div>
    </details>
  </fieldset>




</div>

<div class="stage">
  <fieldset class="previewbox">
    <legend>预览</legend>
    <button class="pri" id="pushbtn" disabled style="width:100%;margin:0 0 4px">推送清单</button>
    <canvas id="preview" title="点击可全屏放大"></canvas>
    <div class="meta" id="meta"></div>
  </fieldset>
</div>

<div id="zoomlay">
  <canvas id="zoomcv"></canvas>
  <button class="zclose">关闭</button>
</div>
</main>

<script>
"use strict";
// 脚本整体出错时给出可见提示（否则表现为「按钮点了没反应」）
window.__booted = false;
window.addEventListener("error", function(ev){
  if(window.__booted) return;
  var b = document.getElementById("build");
  if(b){ b.textContent = "⚠ 脚本出错：" + (ev.message||"") + " —— 请刷新或换浏览器"; b.style.color = "#ff7b7b"; }
});
const $ = id => document.getElementById(id);

const BUILD = "v11-slim";
$("build").textContent = "构建 " + BUILD + " · 分栏卡片 → 1bit 位图";
const FONT = '"PingFang SC","Hiragino Sans GB","Heiti SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif';

const pv = $("preview"), pctx = pv.getContext("2d");
const off = document.createElement("canvas");
let octx = off.getContext("2d", {willReadFrequently:true});

/* 唯一的参数来源：初始默认值、「恢复推荐参数」按钮、存档清除都基于它 */
const DEFAULTS = {
  // 屏幕
  pw:400, ph:300, rot:0,
  // 分栏
  cols:4, balance:true, cardborder:true, stretch:true,
  gap:5, pad:6, inset:0.05, ipad:0.04,
  // 标题条
  title:"备货库存", tfs:38, tfw:500,
  hdrfull:true, hdrstyle:"gray", hdrgray:0.5,
  hdrline:false, hdrlinew:15,
  // 卡片文字
  cfs:18, ifs:13, lht:145, tgap:3,
  autofit:true, nowrap:true, minfs:10, light:false,
  // 数量列
  numright:true,
  // 二值化与导出
  mode:"th", th:128, bpl:48
};
const P = Object.assign({}, DEFAULTS);
let LAST = null;

/* ---------------- 解析 ---------------- */
// @分类 → 新分类；"名称 ×3" / "名称 x3" / "名称*3" → 带数量条目
function parse(src){
  const cats = []; let cur = null;
  for(let raw of src.split(/\r?\n/)){
    const line = raw.trim();
    if(!line) continue;
    let m = line.match(/^@\s*(.+)$/);
    if(m){ cur = {title:m[1].trim(), items:[]}; cats.push(cur); continue; }
    if(!cur){ cur = {title:"", items:[]}; cats.push(cur); }
    const c = line.match(/^(.*?)[\s]*[x×*＊]\s*(\d+)\s*$/i);
    if(c && c[1].trim()) cur.items.push({name:c[1].trim(), n:parseInt(c[2],10)});
    else cur.items.push({name:line, n:1});
  }
  return cats.filter(c=>c.items.length || c.title);
}

/* ---------------- 文本换行（中文逐字断，西文按空格） ---------------- */
function wrap(c, text, maxW){
  if(c.measureText(text).width <= maxW) return [text];
  const out = []; let line = "";
  const tokens = [];
  let buf = "";
  for(const ch of text){
    if(/[\u2E80-\u9FFF\u3000-\u303F\uFF00-\uFFEF]/.test(ch)){ if(buf){tokens.push(buf);buf="";} tokens.push(ch); }
    else if(ch===" "){ if(buf){tokens.push(buf);buf="";} tokens.push(" "); }
    else buf += ch;
  }
  if(buf) tokens.push(buf);

  for(const t of tokens){
    const cand = line + t;
    if(c.measureText(cand).width > maxW && line){
      out.push(line.replace(/\s+$/,"")); line = (t===" "?"":t);
    } else line = cand;
  }
  if(line.trim()) out.push(line.replace(/\s+$/,""));
  return out.length ? out : [text];
}

/* ---------------- 自动归类 ----------------
   纯本地关键词匹配，不需要联网也不需要 API key。
   命中关键词越长分数越高；分数相同按栏目在清单里的先后顺序。
   都不命中时退回「通用启发式」，再不中就交给用户选。 */
const KEYWORDS = {
  "洗护清洁": ["洗衣液","洗衣","衣物","柔顺剂","漂洗","去渍","除螨",
              "厕所","马桶","洁厕","浴室清洁","香氛","除臭","消毒","灭菌","酒精",
              "漂白","84","洗洁精","洗碗","厨房","油污","地板","拖地","清洁剂","洗手液",
              "砂纸","钢丝球","百洁布","抹布","海绵","清洁刷"],
  "身体洗护": ["沐浴","洗澡","沐浴球","沐浴泡","泡沫浴","香皂","洗手液",
              "洗发","护发","润发","发乳","身体乳","润肤","止汗","腋下",
              "搓澡","磨砂","足部","洗脚","护手霜","护手","护足","身体"],
  "面部护理": ["面膜","洗面奶","洁面","卸妆","爽肤水","柔肤水",
              "精华","化妆水","乳液","面霜","眼霜","防晒","护肤","粉扑","化妆刷","睫毛",
              "黑头","痘痘","痤疮","水乳","气泡","清洁泥","撕拉","唇膏","口红","香水",
              "剃须","须刀","剃"],
  "口腔&造型": ["牙膏","牙刷","牙线","牙签","漱口水","牙粉","洁牙","牙膜","口香糖",
              "发蜡","发胶","定型","啫喱","摩丝","发膜","发油","造型","梳子","卷发","蓬松粉"]
};
// 通用启发式：关键词表没覆盖到的新词也能大致归位
const HEURISTICS = [
  { re:/牙|口腔|漱口/,                 score:6 },
  { re:/清洁|消毒|漂白|84|洗衣|衣物|厨房|马桶|厕所/, score:6 },
  { re:/洗发|护发|润发|沐浴|身体|香皂|止汗/,     score:5 },
  { re:/发蜡|发胶|定型|造型|梳/,               score:5 },
  { re:/面|妆|肤|精华|面膜|水乳/,             score:5 }
];

function classify(text, cats){
  const t = text.trim();
  // 1) 显式指定：「@栏目 名称」或「栏目 名称」
  for(const c of cats){
    for(const p of ["@"+c.title, c.title]){
      if(t.startsWith(p)){
        const rest = t.slice(p.length).replace(/^[\s:：]+/,"");
        if(rest) return {cat:c.title, name:rest, forced:true};
      }
    }
  }
  const name = t.replace(/[\s]+(\d+)\s*$/, (_,d)=>"").trim() || t;

  // 2) 关键词表打分
  let best = null;
  for(const c of cats){
    let s = 0, hits = [];
    for(const kw of (KEYWORDS[c.title] || [])){
      if(kw && name.includes(kw)){ s += kw.length * 2; hits.push(kw); }
    }
    if(s && (!best || s > best.score)) best = {cat:c.title, score:s, hits};
  }
  // 3) 启发式兜底
  if(!best){
    for(const c of cats){
      let s = 0, hits = [];
      for(const h of HEURISTICS){
        if(h.re.test(name)){ s = Math.max(s, h.score); hits.push("字面匹配"); }
      }
      if(s && (!best || s > best.score)) best = {cat:c.title, score:s, hits};
    }
  }
  return best ? {cat:best.cat, name, score:best.score, hits:best.hits} : {cat:null, name};
}

/* ---------------- 清单编辑 ---------------- */
function getCats(){ return parse($("src").value); }
function setCats(cats){
  $("src").value = cats.map(c=>
    ["@"+c.title].concat(c.items.map(it=>`${it.name} ×${it.n}`)).join("\n")
  ).join("\n\n");
  onDataChanged();
}
function onDataChanged(){ clearTimeout(tm); tm = setTimeout(()=>{ draw(); save(); renderCats(); }, 40); }

function addItem(catTitle, name, n){
  const cats = getCats();
  const c = cats.find(x=>x.title === catTitle);
  if(!c) return false;
  const dup = c.items.find(it=>it.name === name);
  if(dup) dup.n = n != null ? n : dup.n + 1;   // 同名再加 = 数量累加
  else c.items.push({name, n: n != null ? n : 1});
  setCats(cats);
  return true;
}

/* 在全部栏目里找匹配的物品：完全相同 > 开头相同 > 包含；名称长的优先（更具体） */
function findMatches(q, cats){
  const t = q.trim();
  if(!t) return [];
  const out = [];
  for(const c of cats){
    c.items.forEach((it, i)=>{
      const nm = it.name.toLowerCase(), s = t.toLowerCase();
      let rank = 0;
      if(nm === s) rank = 3;
      else if(nm.startsWith(s)) rank = 2;
      else if(nm.includes(s)) rank = 1;
      else if(s.includes(nm)) rank = 1;
      if(rank) out.push({cat:c.title, idx:i, name:it.name, n:it.n||1, rank});
    });
  }
  out.sort((a,b)=> b.rank - a.rank || b.name.length - a.name.length);
  return out.slice(0, 12);
}

function renderMatches(){
  const box = $("matches");
  const q = $("quickdel").value;
  const hits = findMatches(q, getCats());
  box.innerHTML = "";
  for(const h of hits){
    const b = document.createElement("button");
    b.className = "chip";
    b.innerHTML = `<span>${esc(h.name)}</span><span class="n">×${h.n}</span><span class="who">${esc(h.cat)}</span>`;
    b.onclick = ()=>{
      const r = bumpCount(h.cat, h.idx, -1);
      if(r === "floor") flashVerdict(`「${h.name}」已经是 ×1 了。要从清单移除请在清单里点 ✕。`);
      renderMatches();
    };
    box.appendChild(b);
  }
  if(q.trim() && !hits.length){
    const s = document.createElement("div");
    s.className = "empty"; s.textContent = `清单里没有匹配「${q.trim()}」的物品`;
    box.appendChild(s);
  }
}
function bumpCount(catTitle, idx, delta){
  const cats = getCats();
  const c = cats.find(x=>x.title === catTitle);
  if(!c || !c.items[idx]) return "none";
  const cur = c.items[idx].n || 1;
  if(delta < 0 && cur <= 1) return "floor";      // 到 1 为止，不自动删除；删除请点 ✕
  c.items[idx].n = Math.max(1, cur + delta);
  setCats(cats);
  return c.items[idx].n;
}
function removeItem(catTitle, idx){
  const cats = getCats();
  const c = cats.find(x=>x.title === catTitle);
  if(!c) return;
  c.items.splice(idx,1);
  setCats(cats);
}
function moveItem(from, idx, to){
  const cats = getCats();
  const a = cats.find(x=>x.title===from), b = cats.find(x=>x.title===to);
  if(!a || !b || from===to) return;
  b.items.push(a.items.splice(idx,1)[0]);
  setCats(cats);
}

function renderCats(){
  const cats = getCats();
  const box = $("cats");
  box.innerHTML = "";
  if(!cats.length){ box.innerHTML = '<div class="empty">清单是空的，用上面的输入框添加物品。</div>'; return; }
  for(const c of cats){
    const d = document.createElement("div"); d.className = "cat";
    const h = document.createElement("h4");
    h.innerHTML = `<span style="color:#e6e8ee">${esc(c.title)}</span><span>${c.items.length} 项</span>`;
    d.appendChild(h);
    if(!c.items.length) d.appendChild(Object.assign(document.createElement("div"),
      {className:"empty", textContent:"（空）"}));
    c.items.forEach((it, i)=>{
      const r = document.createElement("div"); r.className = "row-item";
      const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = it.name;

      const st = document.createElement("div"); st.className = "stepper";
      const minus = document.createElement("button"); minus.textContent = "−";
      minus.title = "减少（最少 1，删除请点 ✕）";
      minus.onclick = ()=>{ const r = bumpCount(c.title, i, -1);
        if(r === "floor") flashVerdict(`「${it.name}」已经是 ×1 了。要从清单移除请点右侧 ✕。`); };
      const num = document.createElement("span"); num.className = "n"; num.textContent = "×"+(it.n||1);
      const plus = document.createElement("button"); plus.textContent = "+";
      plus.title = "增加"; plus.onclick = ()=>bumpCount(c.title, i, +1);
      st.append(minus, num, plus);

      const del = document.createElement("button"); del.className = "del"; del.textContent = "✕";
      del.title = "删除"; del.onclick = ()=>removeItem(c.title, i);

      r.append(nm, st, del);
      nm.onclick = ()=>cycleCat(c.title, i);       // 点名称可换栏目
      nm.title = "点击可换到其他栏目";
      d.appendChild(r);
    });
    box.appendChild(d);
  }
}
let cyc = 0;
function cycleCat(from, idx){
  const cats = getCats();
  if(cats.length < 2) return;
  cyc = (cyc+1) % (cats.length-1);
  const others = cats.filter(c=>c.title !== from);
  moveItem(from, idx, others[cyc].title);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------------- 布局 ---------------- */
function layout(design, cats){
  const {W,H} = design;
  const font = (s,w)=>`${w} ${s}px ${FONT}`;
  const L = {warn:[]};

  // 顶部标题条：高度按字号紧凑计算（不再留过多空白），字号本身不受影响
  const wantH = Math.round(P.tfs * 1.45);                     // 字高 + 少量上下留白
  const hdrH = Math.max(Math.round(H * P.hdrlinew/100), wantH);
  L.hdrH = hdrH;
  L.bandInset = Math.round(W*0.03);

  const top = hdrH + Math.round(H*0.012);
  const pad = P.pad;
  const gap = P.gap;
  // 栏宽：先整除，把余数分给前几栏，保证总宽正好填满屏幕（否则右侧会留 1px 白边）
  const total = W - pad*2 - gap*(P.cols-1);
  const baseW = Math.floor(total / P.cols);
  const extra  = total - baseW * P.cols;          // 0 ~ cols-1
  const colW = i => baseW + (i < extra ? 1 : 0);
  const cardW = baseW;
  if(cardW < 12){ L.warn.push("栏数过多/间距太大，每栏不足 12px"); }
  const cardH = H - top - pad;
  const innerW = cardW - Math.round(cardW*P.inset);   // 卡片内缩
  const ipad = Math.round(innerW*P.ipad);             // 文字左内边距

  const iLineH = Math.round(P.ifs * P.lht/100);

  const availW = innerW - 2*ipad;              // 卡片内可用文字宽度（各卡片相同）

  // 分类名：所有卡片统一字号 —— 取「能让最长分类名单行放下」的值，大小才一致
  const titleFloor = (ifs)=> Math.max(ifs + 3, Math.round(ifs*1.35));
  const globalTitleSize = (ifs, cfs)=>{
    const floorT = titleFloor(ifs);
    let s = Math.max(cfs, floorT);
    for(const cat of cats){
      const t = cat.title || " ";
      octx.font = font(s,700);
      while(s > floorT && octx.measureText(t).width > availW) s--;
    }
    return s;
  };

  const measure = (cat, ifs, cfs, tSize)=>{
    const lh = Math.round(ifs * P.lht/100);
    const rawTitle = cat.title || " ";
    octx.font = font(tSize,700);
    const tLines = wrap(octx, rawTitle, availW);
    const tLH = Math.round(tSize*1.28);

    octx.font = font(ifs, P.light?400:700);
    const lines=[]; let wrapped=0;
    // 每行 = {name, cnt}，cnt 单独绘制时按卡片右缘右对齐（保留 ×）
    const maxCnt = cat.items.reduce((a,it)=>Math.max(a, `×${it.n}`.length), 2);
    const cw = P.numright ? octx.measureText("0".repeat(maxCnt)).width + ifs*0.14 : 0;
    const nameW = Math.max(12, availW - cw);
    for(const it of cat.items){
      const wl = wrap(octx, it.name, nameW);        // 名称排版，末行留出 ×N 的位置
      if(wl.length>1) wrapped++;
      wl.forEach((l,i)=> lines.push({name: l, cnt: i === wl.length-1 ? `×${it.n}` : null}));
    }
    const padTop = Math.round(Math.max(cardW*0.06, tSize*0.20));   // 类目上移
    const padBot = Math.round(Math.max(cardW*0.10, ifs*0.22));
    const gapTI = Math.round(Math.max(lh*0.55, tSize*0.50)) + P.tgap;   // 类目与条目间距（可加）
    const h = padTop + tLines.length*tLH + (cat.items.length?gapTI:0) + lines.length*lh + padBot;
    return {title:rawTitle, tLines, lines, wrapped, h, tSize, tLH, padTop, padBot, ifs, cfs, lh, gapTI, availW};
  };

  let gT = globalTitleSize(P.ifs, P.cfs);
  let m = cats.map(c=>measure(c, P.ifs, P.cfs, gT));

  // ① 全局缩放：只动条目字号，分类名统一保持不变（保证层级与一致）。缩到下限就停，允许换行。
  const floor = P.minfs;
  for(let k=0;k<24;k++){
    const okV = cats.every((c,i)=> m[i].h <= cardH);
    const okH = !P.nowrap || cats.every((c,i)=> m[i].wrapped === 0);
    if((!P.autofit) || (okV && okH)) break;
    if(P.ifs<=floor) break;
    P.ifs = Math.max(floor, P.ifs-1);
    syncFontInputs();
    gT = globalTitleSize(P.ifs, P.cfs);
    m = cats.map(c=>measure(c, P.ifs, P.cfs, gT));
  }
  if(P.nowrap && cats.some((c,i)=>m[i].wrapped))
    L.warn.push(`条目已缩到最小可读字号 ${floor}px，个别名称仍需换行 —— 可加宽屏幕 / 减栏数 / 缩短名称`);

  // ② 逐卡兜底：仍然超高的那张卡单独再压自己的条目字号（分类名照旧统一大号），保证条目不丢
  for(let i=0;i<m.length;i++){
    let guard=0;
    while(m[i].h > cardH && m[i].ifs > floor && guard++ < 20)
      m[i] = measure(cats[i], m[i].ifs-1, P.cfs, gT);
    if(m[i].h > cardH) L.trunc = (L.trunc||[]).concat(m[i].title);
  }
  L.titleSize = gT;

  // 分栏
  const buckets = Array.from({length:P.cols}, ()=>[]);
  if(P.balance){
    const fill = Array(P.cols).fill(0);
    cats.forEach((c,i)=>{
      let k = fill.indexOf(Math.min(...fill));
      buckets[k].push({cat:c, m:m[i]});
      fill[k] += m[i].h + gap;
    });
  } else {
    cats.forEach((c,i)=>{ buckets[i] = [{cat:c, m:m[i]}]; });
  }

  L.buckets = buckets; L.cardW = cardW; L.colW = colW; L.cardH = cardH; L.colH = cardH;
  L.top = top; L.pad = pad;
  L.gap = gap; L.innerW = innerW; L.ipad = ipad; L.iLineH = iLineH;
  return L;
}

/* ---------------- 1bpp 抖动灰带 ---------------- */
// PATTERN 是「每行」的位串字符串，循环使用；u = 行长
const PATTERNS = {
  "0.25": { u:4, rows:["1000","0000","0000","0000"] },   // 4×4 单元 1/16 ≈ 浅灰
  "0.50": { u:2, rows:["10","01"] },                      // 2×2 棋盘 = 真 50%，视觉最均匀
  "0.75": { u:4, rows:["1110","1110","1110","1110"] },   // 4×4 单元 12/16 = 75% 深灰
  "0.875":{ u:2, rows:["11","11"] }                       // 直接 2×2 全涂 ≈ 接近实心
};
function ditherBand(x, y, w, h, level){
  if(level <= 0) return;
  octx.fillStyle = "#000";
  if(level >= 1){ octx.fillRect(x,y,w,h); return; }
  const keys = Object.keys(PATTERNS);
  const key = keys.reduce((a,k)=> Math.abs(+k-level) < Math.abs(+a-level) ? k : a, "0.50");
  const P = PATTERNS[key];
  const x0 = Math.max(0, x|0), y0 = Math.max(0, y|0);
  const x1 = Math.min(off.width, (x+w)|0), y1 = Math.min(off.height, (y+h)|0);
  const n = P.rows.length;
  for(let py=y0; py<y1; py++){
    const row = P.rows[py % n];
    for(let px=x0; px<x1; px++)
      if(row[px % P.u] === "1") octx.fillRect(px, py, 1, 1);
  }
}

/* ---------------- 绘制 ---------------- */
function draw(){
  const {W,H} = designSize();
  const cats = parse($("src").value);
  const L = layout({W,H}, cats);

  octx = off.getContext("2d",{willReadFrequently:true});
  off.width = W; off.height = H;
  octx.fillStyle = "#fff"; octx.fillRect(0,0,W,H);   // 墨水屏底色 = 白
  octx.textBaseline = "alphabetic";
  const font = (s,w)=>`${w} ${s}px ${FONT}`;

  /* --- 标题条：网点灰底 + 反白字 --- */
  const bi = P.hdrfull ? 0 : L.bandInset;     // 满幅：灰底一直延伸到屏幕左右边缘
  const bandW = W - bi*2;

  const tPad = Math.round(W*0.035);
  const tLH2 = Math.round(P.tfs*1.22);
  const rawTitle = $("title").value || " ";
  octx.font = font(P.tfs, P.tfw);
  let tl = wrap(octx, rawTitle, bandW - tPad*2);
  // 标题换行会糊：能单行就单行（下限 18px）
  if(tl.length > 1){
    let s = P.tfs;
    while(tl.length > 1 && s > 18){
      s -= 1;
      octx.font = font(s, P.tfw);
      tl = wrap(octx, rawTitle, bandW - tPad*2);
    }
  }
  const bandInner = P.hdrfull ? L.hdrH
                             : Math.max(Math.round(P.tfs*1.42), Math.round(L.hdrH*0.92));
  const bandY = P.hdrfull ? 0 : Math.round((L.hdrH - bandInner)/2);

  // 垂直居中：用实际字形墨迹盒（ascent/descent）算，而不是猜 0.78em
  const tm = octx.measureText(tl[0]);
  const inkA = tm.actualBoundingBoxAscent  || P.tfs*0.88;
  const inkD = tm.actualBoundingBoxDescent || P.tfs*0.12;
  const inkH = inkA + inkD;
  const blockH = inkH + (tl.length-1)*tLH2;
  let ty = Math.round(bandY + (bandInner - blockH)/2 + inkA);
  const titleXY = tl.map(l=>{
    const tw = octx.measureText(l).width;
    const r = { x: Math.round((W-tw)/2), y: ty, t: l };   // 水平居中 + 垂直居中
    ty += tLH2; return r;
  });

  if(P.hdrstyle !== "none" && bandInner > 2){
    if(P.hdrstyle === "solid"){ octx.fillStyle = "#000"; octx.fillRect(bi,bandY,bandW,bandInner); }
    else ditherBand(bi, bandY, bandW, bandInner, P.hdrgray);

    /* 反白字的正确做法：先做"掩膜"再挖网点。
       直接把字填白时，2×2 网点会从笔画缝里透进来，字就糊了。
       这里把字形用描边向外撑厚 1~2px 作为掩膜，掩膜内整片填白 → 笔画实心、彼此分开。 */
    const mk = document.createElement("canvas");
    mk.width = W; mk.height = H;
    const mc = mk.getContext("2d", {willReadFrequently:true});
    mc.fillStyle = "#000"; mc.strokeStyle = "#000";
    mc.lineJoin = "round"; mc.lineCap = "round";
    mc.font = font(P.tfs, P.tfw);
    // 掩膜 = 原始字形（可调字重）+ 1px 描边补网点缝
    mc.lineWidth = 1;
    titleXY.forEach(r=> mc.fillText(r.t, r.x, r.y));
    titleXY.forEach(r=> mc.strokeText(r.t, r.x, r.y));
    const md = mc.getImageData(0,0,W,H).data;
    const od = octx.getImageData(0,0,W,H);
    const od_ = od.data;
    for(let y=Math.max(0,bandY); y<Math.min(H, bandY+bandInner); y++){
      for(let x=bi; x<bi+bandW; x++){
        if(x<0||x>=W) continue;
        if(md[(y*W+x)*4+3] >= 110){ const o=(y*W+x)*4; od_[o]=255; od_[o+1]=255; od_[o+2]=255; }
      }
    }
    octx.putImageData(od, 0, 0);
  } else {
    octx.fillStyle = "#000";
    titleXY.forEach(r=> octx.fillText(r.t, r.x, r.y));
  }
  if(P.hdrline){
    octx.fillStyle = "#000";
    octx.fillRect(0, L.hdrH, W, Math.max(1, Math.round(H*0.004)));
  }

  /* --- 卡片 --- */
  octx.fillStyle = "#000"; octx.strokeStyle = "#000";
  L.buckets.forEach((bucket,k)=>{
    const cw2 = L.colW(k);                     // 该栏实际宽度（吸收整除余数）
    const x = L.pad + k*(cw2 + L.gap);
    let y = L.top;
    bucket.forEach(({cat, m:mm}, idx)=>{
      const n = bucket.length;
      const cardH = P.stretch
        ? (L.colH - L.gap*(n-1)) / n
        : Math.min(mm.h, L.colH);
      if(P.cardborder){
        octx.lineWidth = Math.max(1, Math.round(W*0.0022));
        rr(x, y, cw2, cardH, Math.round(Math.min(cw2,cardH)*0.05));
        octx.stroke();
      }
      let cy = y + mm.padTop + mm.tSize;
      octx.font = font(mm.tSize,700);
      mm.tLines.forEach(l=>{ octx.fillText(l, x+L.ipad, cy); cy += mm.tLH; });
      cy = y + mm.padTop + mm.tLines.length*mm.tLH + mm.gapTI;
      octx.font = font(mm.ifs, P.light?400:700);
      let clipped = false;
      const rightX = x + cw2 - L.ipad;
      for(const line of mm.lines){
        if(cy > y + cardH - Math.round(mm.ifs*0.30)){ clipped = true; break; }
        octx.fillText(line.name, x+L.ipad, cy);
        if(line.cnt){
          // 数量靠卡片右缘右对齐（保留 ×）
          const cw2 = octx.measureText(line.cnt).width;
          octx.fillText(line.cnt, Math.round(rightX - cw2), cy);
        }
        cy += mm.lh;
      }
      if(clipped) L.warn.push(`「${mm.title}」内容超出可用高度，已省略末尾条目`);
      y += cardH + L.gap;
    });
  });

  /* --- 旋转到物理朝向 --- */
  const phys = rotate(off, P.rot);
  const img = octx.getImageData(0,0,phys.width,phys.height);
  const bits = binarise(img);
  LAST = {w:phys.width, h:phys.height, bits, src:phys};
  paint(bits, phys);
  updateMeta(cats, L, phys, bits);
}

function rr(x,y,w,h,r){
  octx.beginPath();
  octx.moveTo(x+r,y); octx.lineTo(x+w-r,y); octx.quadraticCurveTo(x+w,y,x+w,y+r);
  octx.lineTo(x+w,y+h-r); octx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  octx.lineTo(x+r,y+h); octx.quadraticCurveTo(x,y+h,x,y+h-r);
  octx.lineTo(x,y+r); octx.quadraticCurveTo(x,y,x+r,y);
  octx.closePath();
}

function designSize(){
  const r = P.rot;
  return (r===90||r===270) ? {W:P.ph, H:P.pw} : {W:P.pw, H:P.ph};
}
function rotate(src, deg){
  if(!deg) return src;
  const c = document.createElement("canvas");
  const swap = (deg===90||deg===270);
  c.width  = swap ? src.height  : src.width;
  c.height = swap ? src.width   : src.height;
  const x = c.getContext("2d");
  x.translate(c.width/2, c.height/2);
  x.rotate(deg*Math.PI/180);
  x.drawImage(src, -src.width/2, -src.height/2);
  return c;
}

/* ---------------- 二值化 ---------------- */
function binarise(img){
  const {width:w,height:h,data:d} = img;
  const o = new Uint8Array(w*h);
  if(P.mode==="fs"){
    const g = new Float32Array(w*h);
    for(let i=0;i<w*h;i++) g[i] = 0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];
    for(let y=0;y<h;y++){
      const rev = (y&1)===1;
      for(let k=0;k<w;k++){
        const x = rev?w-1-k:k, i=y*w+x, old=g[i], nw = old < P.th ? 1 : 0;
        o[i]=nw; const err = old-(nw?0:255); if(!err) continue;
        const put=(xx,yy,f)=>{ if(xx<0||xx>=w||yy<0||yy>=h) return; g[yy*w+xx]+=err*f; };
        if(rev){put(x-1,y,7/16);put(x+1,y,3/16);put(x,y+1,5/16);put(x-1,y+1,1/16);}
        else   {put(x+1,y,7/16);put(x-1,y,3/16);put(x,y+1,5/16);put(x+1,y+1,1/16);}
      }
    }
  } else {
    for(let i=0;i<w*h;i++) o[i] = (0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2]) < P.th ? 1 : 0;
  }
  return o;
}

/* 画布尺寸 = 实际显示尺寸，用最近邻直接画进去。
   放大取整数倍保持锐利；缩小时直接降分辨率（避免 CSS 非整数拉伸导致像素宽窄不一）。 */
function paint(bits, src){
  const w=src.width, h=src.height;
  const tmp=document.createElement("canvas"); tmp.width=w;tmp.height=h;
  const tc=tmp.getContext("2d"); const id=tc.createImageData(w,h);
  for(let i=0;i<w*h;i++){ const v=bits[i]?0:255; id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v; id.data[i*4+3]=255; }
  tc.putImageData(id,0,0);

  const stage = document.querySelector(".stage");
  const cs = stage ? getComputedStyle(stage) : null;
  const padX = cs ? parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) : 24;
  // 宽度取预览框的内容区（与左侧输入框同宽），并以视口宽为上限
  const availW = Math.max(60, Math.min(
    (stage ? stage.clientWidth - padX : 600),
    window.innerWidth - 26
  ));
  // 高度：只有预览区高度是被 CSS 固定死时（桌面右栏）才受它限制；
  // 手机上高度由内容决定，若拿它当上限会把图压得很小 —— 此时只按宽度定。
  const fixedH = stage && stage.clientHeight > 120 &&
                 getComputedStyle(stage).height !== "auto";
  const availH = fixedH ? (stage.clientHeight - 34) : 4000;

  const scale = Math.min(availW / w, availH / h);
  let tw, th;
  if(scale >= 1){ const z = Math.min(Math.floor(scale), 6); tw = w*z; th = h*z; }
  else { tw = Math.max(48, Math.round(w*scale)); th = Math.round(h*scale); }

  pv.width = tw; pv.height = th;
  pv.style.width  = tw + "px";
  pv.style.height = th + "px";
  pctx.imageSmoothingEnabled = false;
  pctx.drawImage(tmp, 0, 0, tw, th);
}

// 尺寸变化时重算缩放（手机横竖屏切换、地址栏收起都要跟上）
window.addEventListener("resize", function(){
  if(window.__last && window.__last.src) paint(window.__last.bits, window.__last.src);
});
window.addEventListener("orientationchange", function(){
  setTimeout(function(){
    if(window.__last && window.__last.src) paint(window.__last.bits, window.__last.src);
  }, 250);
});

// 点预览图 → 全屏放大；再点关闭
function openZoom(){
  if(!LAST) return;
  const lay = $("zoomlay"), zc = $("zoomcv");
  const w = LAST.w, h = LAST.h, bits = LAST.bits;
  // 全屏时按屏宽放大到整数倍，最清晰的查看方式
  const zoom = Math.max(1, Math.floor((window.innerWidth - 34) / w));
  zc.width = w*zoom; zc.height = h*zoom;
  zc.style.width = zc.width + "px"; zc.style.height = zc.height + "px";
  const zx = zc.getContext("2d");
  const tmp = document.createElement("canvas"); tmp.width=w; tmp.height=h;
  const tc = tmp.getContext("2d"); const id = tc.createImageData(w,h);
  for(let i=0;i<w*h;i++){ const v = bits[i]?0:255; id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v; id.data[i*4+3]=255; }
  tc.putImageData(id,0,0);
  zx.imageSmoothingEnabled = false;
  zx.drawImage(tmp,0,0,zc.width,zc.height);
  lay.classList.add("on");
}
function closeZoom(){ $("zoomlay").classList.remove("on"); }

/* ---------------- 帧缓冲 ---------------- */
function pack(bits,w,h){
  const stride = Math.ceil(w/8);
  const buf = new Uint8Array(stride*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++)
    if(bits[y*w+x]) buf[y*stride+(x>>3)] |= 0x80>>(x&7);
  return buf;
}
function fwText(bits,w,h){
  const buf = pack(bits,w,h), out=[];
  for(let off=0; off<buf.length; off+=P.bpl){
    let hex="";
    for(let i=off;i<Math.min(off+P.bpl,buf.length);i++) hex+=buf[i].toString(16).padStart(2,"0");
    out.push(`FW:${off.toString(16).padStart(4,"0")}:${hex}`);
  }
  out.push("FAPPLY");
  return out.join("\n");
}

/* updateMeta：紧凑单行，详细信息放 title */

function updateMeta(cats,L,phys,bits){
  const w=LAST.w,h=LAST.h, stride=Math.ceil(w/8);
  const n = cats.reduce((a,c)=>a+c.items.length,0);
  const warn = [...new Set(L.warn)];
  const el = $("meta");
  el.textContent = w + "\u00d7" + h + " \u00b7 " + P.cols + "\u680f \u00b7 " + cats.length + "\u7c7b" + n + "\u9879"
                 + (warn.length ? " \u00b7 \u26a0" : "");
  el.title = (warn.length ? warn.join("\n") + "\n" : "") + "1bpp \u5e27\u7f13\u51b2 " + (stride*h) + " \u5b57\u8282";
  el.className = warn.length ? "meta warn" : "meta";
}

/* ================= 墨水屏推送（tsl0922/EPD-nRF5 协议） =================
   Service      62750001-d828-918d-fb46-b6c11c675aec
   Write  char  62750002-d828-918d-fb46-b6c11c675aec
   指令: SET_PINS 0x00 / INIT 0x01 / WRITE_IMG 0x30 / REFRESH 0x05
   位图排布: byteIndex = y*ceil(w/8) + (x>>3)，bit = 7-(x&7)
   ⚠ 该固件 1 = 白、0 = 黑（和常见约定相反，照抄官方实现）
   ⚠ 必须先 SET_PINS + INIT 下发驱动，否则屏未初始化，显示必花 */
const EPD = {
  svc:    "62750001-d828-918d-fb46-b6c11c675aec",
  write:  "62750002-d828-918d-fb46-b6c11c675aec",
  verChr: "62750003-d828-918d-fb46-b6c11c675aec",
  CMD: { SET_PINS:0x00, INIT:0x01, WRITE_IMG:0x30, REFRESH:0x05 },
  DRV: 0x04,          // 4.2" 黑白 SSD1619 —— 实测这块屏只有它能正常显示
  dev:null, chr:null, mtu:20, rle:false, pins:null, connected:false
};

function bleStat(t, warn){
  const el = $("blestat");
  el.textContent = t;
  el.style.color = warn ? "#ffb454" : "";
}

async function bleConnect(){
  if(!navigator.bluetooth){
    bleStat("这个浏览器不支持蓝牙连接，请用 Bluefy 打开。", true); return;
  }
  bleStat("正在搜索设备…");
  try{
    // 必须 acceptAllDevices，Bluefy 对 filters 支持不好
    EPD.dev = await navigator.bluetooth.requestDevice({
      optionalServices: [EPD.svc], acceptAllDevices: true
    });
  }catch(e){
    bleStat("未连接" + (e && e.name === "NotFoundError" ? "（已取消）" : "：" + (e.message||e)), true);
    return;
  }
  try{
    const server = await EPD.dev.gatt.connect();
    const svc = await server.getPrimaryService(EPD.svc);
    EPD.chr = await svc.getCharacteristic(EPD.write);
    EPD.connected = true;

    let first = true;
    try{
      await EPD.chr.startNotifications();
      EPD.chr.addEventListener("characteristicvaluechanged", ev=>{
        const u8 = new Uint8Array(ev.target.value.buffer, ev.target.value.byteOffset, ev.target.value.byteLength);
        if(first){                                  // 首条通知 = 设备当前引脚配置
          first = false;
          EPD.pins = Array.prototype.slice.call(u8, 0, 7);
          if(u8.length > 10) EPD.pins.push(u8[10]);
          return;
        }
        const msg = new TextDecoder().decode(u8);
        if(msg.indexOf("mtu=") === 0){ const n=parseInt(msg.substring(4),10); if(n>0) EPD.mtu=n; }
        if(msg.indexOf("rle=1") >= 0) EPD.rle = true;
      });
    }catch(e){}

    $("pushbtn").disabled = false;
    bleStat("已连接，可以推送清单。");
  }catch(e){
    bleStat("连接失败：" + (e && e.message ? e.message : e), true);
  }
}

/* 重连：先断开再接回同一台设备；没有设备记录时等同「连接设备」 */
async function bleReconnect(){
  if(!EPD.dev){ bleConnect(); return; }
  bleStat("正在重连…");
  try{ if(EPD.dev.gatt.connected) EPD.dev.gatt.disconnect(); }catch(e){}
  await sleep(600);
  $("pushbtn").disabled = true;
  EPD.chr = null; EPD.connected = false; EPD.pins = null;
  try{
    const server = await EPD.dev.gatt.connect();
    const svc = await server.getPrimaryService(EPD.svc);
    EPD.chr = await svc.getCharacteristic(EPD.write);
    EPD.connected = true;
    let first = true;
    try{
      await EPD.chr.startNotifications();
      EPD.chr.addEventListener("characteristicvaluechanged", ev=>{
        const u8 = new Uint8Array(ev.target.value.buffer, ev.target.value.byteOffset, ev.target.value.byteLength);
        if(first){ first = false;
          EPD.pins = Array.prototype.slice.call(u8, 0, 7);
          if(u8.length > 10) EPD.pins.push(u8[10]);
          return; }
        const msg = new TextDecoder().decode(u8);
        if(msg.indexOf("mtu=") === 0){ const n=parseInt(msg.substring(4),10); if(n>0) EPD.mtu=n; }
        if(msg.indexOf("rle=1") >= 0) EPD.rle = true;
      });
    }catch(e){}
    $("pushbtn").disabled = false;
    bleStat("已重新连接。");
  }catch(e){
    bleStat("重连失败：" + (e && e.message ? e.message : e) + "，可再点一次「连接设备」。", true);
  }
}

async function epdWrite(cmd, payload){
  let buf;
  if(payload){ buf = new Uint8Array(payload.length + 1); buf[0] = cmd; buf.set(payload, 1); }
  else buf = new Uint8Array([cmd]);
  try{ await EPD.chr.writeValueWithoutResponse(buf); }
  catch(e){ await EPD.chr.writeValueWithResponse(buf); }
}
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

async function pushToEPD(){
  if(!EPD.chr){ bleStat("请先点「连接设备」。", true); return; }
  if(!LAST) draw();
  const btn = $("pushbtn");
  btn.disabled = true;
  try{
    const w = LAST.w, h = LAST.h, bits = LAST.bits;
    const stride = Math.ceil(w/8);
    const raw = new Uint8Array(stride*h);
    // 该固件 1=白、0=黑
    for(let y=0;y<h;y++) for(let x=0;x<w;x++)
      if(!bits[y*w+x]) raw[y*stride + (x>>3)] |= 0x80 >> (x&7);

    // 1) 下发引脚 + 驱动（不清屏），否则面板未初始化必花屏
    const pins = EPD.pins ? new Uint8Array(EPD.pins)
                          : new Uint8Array([0,0,0,0,0,0,0]);
    await epdWrite(EPD.CMD.SET_PINS, pins);
    await sleep(120);
    await epdWrite(EPD.CMD.INIT, new Uint8Array([EPD.DRV]));
    await sleep(500);

    // 2) 分片
    const chunk = Math.max(8, EPD.mtu - 2);
    const total = Math.ceil(raw.length / chunk);
    for(let i=0;i<total;i++){
      const slice = raw.subarray(i*chunk, Math.min(raw.length, (i+1)*chunk));
      const payload = new Uint8Array(slice.length + 1);
      payload[0] = EPD.rle ? (i===0 ? 0x02 : 0x00) : ((i===0 ? 0x0F : 0xF0) | 0x0F);
      payload.set(slice, 1);
      await epdWrite(EPD.CMD.WRITE_IMG, payload);
      if(i % 4 === 3 || i === total-1){
        bleStat(`正在推送 ${i+1}/${total}…`);
        await sleep(15);
      }
    }

    // 3) 刷新
    await epdWrite(EPD.CMD.REFRESH);
    await sleep(150);
    await epdWrite(EPD.CMD.REFRESH);
    bleStat("已推送，屏幕正在刷新，请勿断电。");
  }catch(e){
    bleStat("推送失败：" + (e && e.message ? e.message : e), true);
  }
  btn.disabled = false;
}

$("blebtn").onclick = bleConnect;

$("pushbtn").onclick = pushToEPD;

/* ---- 快速添加 ---- */
function doAdd(){
  const raw = $("quick").value.trim();
  const v = $("verdict");
  if(!raw) return;
  const cats = getCats();
  if(!cats.length){ flashVerdict("清单是空的，无法归类。"); return; }

  const r = classify(raw, cats);
  // 支持尾部数字：「洗发水 2」= 直接给数量
  let n = null;
  const m = raw.match(/^(.*?)[\s]+(\d+)\s*$/);
  if(m) n = parseInt(m[2],10);

  if(!r.cat){
    askCategory(cats, r.name || raw, n);
    return;
  }
  const name = r.name || raw;
  const dup = cats.flatMap(c=>c.items).find(it=>it.name === name);
  const qty = n != null ? n : 1;
  addItem(r.cat, name, n);
  $("quick").value = "";
  v.hidden = false;
  const hits = (r.hits||[]).filter(Boolean);
  v.innerHTML = `已添加 <b>${esc(name)} ×${qty}</b> 到「<b>${esc(r.cat)}</b>」`
    + (hits.length ? `（识别关键词：${esc(hits.join("、"))}）` : "")
    + (dup && n == null ? ` · 已有同名项，数量已累加` : "");
}
$("addbtn").onclick = doAdd;
$("quick").addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); doAdd(); } });

/* ---- 快速减少 ---- */
$("delbtn").onclick = ()=>{
  const q = $("quickdel").value.trim();
  const v = $("verdict");
  if(!q) return;
  const hits = findMatches(q, getCats());
  if(!hits.length){ v.hidden = false; v.textContent = `清单里没有找到「${q}」。`; return; }
  const h = hits[0];
  const before = h.n;
  bumpCount(h.cat, h.idx, -1);
  v.hidden = false;
  v.textContent = before <= 1
    ? `「${h.name}」已用完，从「${h.cat}」移出清单。`
    : `「${h.name}」在「${h.cat}」减到 ×${before-1}。`;
  renderMatches();
};
